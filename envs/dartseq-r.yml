# R 4.2 + Bioconductor 3.16 packages for deseq2-expression, dart-diff-m6a (step 04) and m6a-metagene.
# The pipeline was developed with Bioconductor 3.15 (DESeq2 1.36, IHW 1.24, Guitar 2.12), which bioconda does not provide;
# 3.16 is the nearest consistent release (see docs/INSTALL.md for the comparison).
name: dartseq-r
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - r-base=4.2
  - bioconductor-deseq2=1.38.0
  - bioconductor-apeglm=1.20.0
  - bioconductor-ihw=1.26.0
  - bioconductor-guitar=2.14.0
  - bioconductor-genomicfeatures=1.50
  - r-ggplot2
  - r-ggrepel
  - r-openxlsx
  - r-data.table
