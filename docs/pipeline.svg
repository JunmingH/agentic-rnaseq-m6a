<text x="1183.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">update STATUS.md,</text>
<text x="1183.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">then the next step</text>
<polyline points="1183.0,718 1183.0,748 103.0,748 103.0,720" fill="none" stroke="#52606d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="643.0" y="764" font-size="11.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">next step   ·   a failed job with a clear cause: delete only its outputs + logs and rerun; unclear: keep logs, report, wait</text>
<text x="30" y="818" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start" font-style="normal">What makes a run reproducible</text>
