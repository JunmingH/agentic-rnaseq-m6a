<text x="555" y="527" font-size="11.5" font-weight="normal" fill="#5c3d00" text-anchor="middle" font-style="normal">read every script, trace each parameter to the tool, check sample placement (R1/R2, control vs edited, reference level), prove with logs + outputs</text>
