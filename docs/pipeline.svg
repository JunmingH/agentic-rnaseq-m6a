<text x="260" y="572" font-size="11.5" font-weight="normal" fill="#616e7c" text-anchor="start" font-style="normal">RNA level (control samples)</text>
<rect x="440" y="560" width="14" height="14" rx="3" fill="#f4effa" stroke="#7b5ea7" stroke-width="1.6"/>
<text x="460" y="572" font-size="11.5" font-weight="normal" fill="#616e7c" text-anchor="start" font-style="normal">m6A level (edited vs control)</text>
<text x="650" y="572" font-size="11.5" font-weight="normal" fill="#b35c00" text-anchor="start" font-style="italic">decide: …  = a choice the user makes (the scripts refuse to run without it)</text>
<text x="30" y="620" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="start" font-style="normal">How every step runs (the same loop for steps 1–8)</text>
<rect x="22" y="640" width="162" height="78" rx="9" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.6"/>
<text x="103.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">1  Load the skill</text>
<text x="103.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">copy scripts/ into the</text>
<text x="103.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">step folder + MANIFEST.md5</text>
<polyline points="184,679 202,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="202" y="640" width="162" height="78" rx="9" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.6"/>
<text x="283.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">2  Write run script</text>
<text x="283.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">run_&lt;step&gt;_&lt;date&gt;.sh sets</text>
<text x="283.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">every required option</text>
<polyline points="364,679 382,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="382" y="640" width="162" height="78" rx="9" fill="#fff6e6" stroke="#d08a2e" stroke-width="1.6"/>
<text x="463.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">3  User approves</text>
<text x="463.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">sample sheet / pairs,</text>
<text x="463.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">parameters, command</text>
<polyline points="544,679 562,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="562" y="640" width="162" height="78" rx="9" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.6"/>
<text x="643.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">4  Test 1 sample</text>
<text x="643.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">check output, runtime,</text>
<text x="643.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">memory (qacct)</text>
<polyline points="724,679 742,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="742" y="640" width="162" height="78" rx="9" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.6"/>
<text x="823.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">5  Submit the batch</text>
<text x="823.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">qsub: one job per sample,</text>
<text x="823.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">logs kept in error_file/</text>
<polyline points="904,679 922,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="922" y="640" width="162" height="78" rx="9" fill="#fff6e6" stroke="#d08a2e" stroke-width="1.6"/>
<text x="1003.0" y="662" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">6  Audit the step</text>
<text x="1003.0" y="684" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">pipeline-audit: code,</text>
<text x="1003.0" y="699" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">parameters, outputs</text>
<polyline points="1084,679 1102,679" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/>
