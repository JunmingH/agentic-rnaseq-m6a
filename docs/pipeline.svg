<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="0" y="0" width="1280" height="930" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/>
<text x="640.0" y="34" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">DART-seq m6A + RNA-seq pipeline: AI agent skills on an SGE cluster</text>
<rect x="8" y="50" width="1264" height="495" rx="14" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="30" y="70" font-size="12.5" font-weight="bold" fill="#616e7c" text-anchor="start" font-style="normal">dartseq-pipeline (orchestrator skill): order, decisions, hand-over files, resume / reproduce</text>
<rect x="40" y="86" width="400" height="44" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="240" y="113" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">Raw paired-end fastq (_1 / _2.fq.gz)</text>
<rect x="470" y="86" width="440" height="44" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="690" y="104" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">Reference: ONE Ensembl release</text>
<text x="690" y="121" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">fasta + GTF, STAR index, RSEM ref, patched refFlat, dbSNP bed</text>
<rect x="940" y="86" width="300" height="44" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1090" y="104" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">Sample sheets (templates/)</text>
<text x="1090" y="121" font-size="11" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">groups, control vs treated, comparisons</text>
<rect x="40" y="250" width="180" height="92" rx="10" fill="#eef4fb" stroke="#4a78b0" stroke-width="1.6"/>
<text x="130.0" y="272" font-size="13.5" font-weight="bold" fill="#4a78b0" text-anchor="middle" font-style="normal">1  fastqc-qc</text>
<text x="130.0" y="291" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">FastQC per file</text>
<text x="130.0" y="306" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">+ MultiQC</text>
<rect x="260" y="250" width="180" height="92" rx="10" fill="#eef4fb" stroke="#4a78b0" stroke-width="1.6"/>
<text x="350.0" y="272" font-size="13.5" font-weight="bold" fill="#4a78b0" text-anchor="middle" font-style="normal">2  read-trimming</text>
<text x="350.0" y="291" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">fastp or Trimmomatic</text>
<text x="350.0" y="306" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">adapters, poly-G, quality</text>
<text x="350.0" y="332" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: tool, MINLEN</text>
<rect x="480" y="250" width="205" height="92" rx="10" fill="#eef4fb" stroke="#4a78b0" stroke-width="1.6"/>
<text x="582.5" y="272" font-size="13.5" font-weight="bold" fill="#4a78b0" text-anchor="middle" font-style="normal">3  star-alignment</text>
<text x="582.5" y="291" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">STAR index + align</text>
<text x="582.5" y="306" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">sort, Picard duplicates</text>
<text x="582.5" y="332" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: RM_DUP, TRANSCRIPTOME</text>
<rect x="750" y="165" width="190" height="92" rx="10" fill="#edf7ee" stroke="#4f9a5a" stroke-width="1.6"/>
<text x="845.0" y="187" font-size="13.5" font-weight="bold" fill="#4f9a5a" text-anchor="middle" font-style="normal">4  rsem-quantification</text>
<text x="845.0" y="206" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">RSEM, control samples</text>
<text x="845.0" y="221" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">strand test on 1 sample</text>
<text x="845.0" y="247" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: STRANDEDNESS</text>
<rect x="750" y="345" width="190" height="92" rx="10" fill="#f4effa" stroke="#7b5ea7" stroke-width="1.6"/>
<text x="845.0" y="367" font-size="13.5" font-weight="bold" fill="#7b5ea7" text-anchor="middle" font-style="normal">5  bullseye-analysis</text>
<text x="845.0" y="386" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">parseBAM, Find_edit_site</text>
<text x="845.0" y="401" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">edited vs control pairs</text>
<text x="845.0" y="427" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: roles, DEDUP, thresholds</text>
<rect x="985" y="165" width="180" height="92" rx="10" fill="#edf7ee" stroke="#4f9a5a" stroke-width="1.6"/>
<text x="1075.0" y="187" font-size="13.5" font-weight="bold" fill="#4f9a5a" text-anchor="middle" font-style="normal">6  deseq2-expression</text>
<text x="1075.0" y="206" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">DESeq2 per comparison</text>
<text x="1075.0" y="221" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">+ PCA</text>
<text x="1075.0" y="247" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: comparisons, subsets</text>
<rect x="985" y="345" width="180" height="92" rx="10" fill="#f4effa" stroke="#7b5ea7" stroke-width="1.6"/>
<text x="1075.0" y="367" font-size="13.5" font-weight="bold" fill="#7b5ea7" text-anchor="middle" font-style="normal">7  dart-diff-m6a</text>
<text x="1075.0" y="386" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">sites in &gt;=2 reps, -dbSNP</text>
<text x="1075.0" y="401" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">GLM + Wald + IHW</text>
<text x="1075.0" y="427" font-size="11" font-weight="normal" fill="#b35c00" text-anchor="middle" font-style="italic">decide: cutoffs, RAC</text>
<rect x="1085" y="462" width="170" height="62" rx="10" fill="#f4effa" stroke="#7b5ea7" stroke-width="1.6"/>
<text x="1170.0" y="484" font-size="13.5" font-weight="bold" fill="#7b5ea7" text-anchor="middle" font-style="normal">8  m6a-metagene</text>
<text x="1170.0" y="503" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="middle" font-style="normal">Guitar 5'UTR / CDS / 3'UTR</text>
