<text x="1221" y="185" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle" font-style="normal">Results</text>
<text x="1221" y="205" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">QC report</text>
<text x="1221" y="220" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">DE tables,</text>
<text x="1221" y="235" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">volcano,</text>
<text x="1221" y="250" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">PCA</text>
<text x="1221" y="265" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">diff m6A</text>
<text x="1221" y="280" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">sites, genes</text>
<text x="1221" y="295" font-size="10.5" font-weight="normal" fill="#616e7c" text-anchor="middle" font-style="normal">metagene</text>
